apiVersion: apps/v1
kind: Deployment
metadata:
  name: skybook-backend
  namespace: skybook
  labels:
    app: skybook
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skybook
      component: backend
  template:
    metadata:
      labels:
        app: skybook
        component: backend
    spec:
      containers:
        - name: backend
          image: skybook/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: skybook-config
            - secretRef:
                name: skybook-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: skybook-backend-svc
  namespace: skybook
spec:
  selector:
    app: skybook
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
