apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: skybook
  labels:
    app: skybook
    component: database
spec:
  serviceName: postgres-svc
  replicas: 1
  selector:
    matchLabels:
      app: skybook
      component: database
  template:
    metadata:
      labels:
        app: skybook
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "skybook"
            - name: POSTGRES_USER
              value: "skybook"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skybook-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: skybook
spec:
  selector:
    app: skybook
    component: database
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
