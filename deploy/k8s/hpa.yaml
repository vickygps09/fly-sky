apiVersion: v1
kind: ServiceAccount
metadata:
  name: skybook-hpa
  namespace: skybook
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skybook-backend-hpa
  namespace: skybook
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skybook-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
